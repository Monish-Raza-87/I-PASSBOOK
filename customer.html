<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indrones Customer Space</title>
<meta name="description" content="After-sales help for Indrones customers — your products, how support works, and every request you have raised with us.">
<link rel="icon" type="image/png" sizes="512x588" href="assets/icon-mark.png">

<!-- This page is now a LOADER, not the portal itself.

     The portal used to live entirely in this file. It lives in portal.css and
     portal.js now, because the same portal has to open in a second place: the
     app's own address (index.html), where a customer signs in and stays. Two
     copies of a 1,900-line page would drift the first time either was edited.

     WHY THIS PAGE STILL EXISTS AT ALL: every invitation email already sent points
     at customer.html. Keeping it — one thin loader over the shared files — means
     those links keep working and still land on the same portal.

     The two files are deliberately NOT loaded on the staff app's normal boot. They
     are fetched at runtime, only after a customer has signed in, so an employee's
     page load never pays for them. -->
<link rel="stylesheet" href="portal.css">

<script>
  // The viewer's stored appearance preference, applied before the first paint so a
  // customer who chose dark does not get a white flash while the page loads. This is
  // the only thing read out of storage before the user does anything, and it is the
  // APP's own key (`theme`) on purpose: same origin, same person, same preference —
  // and a display preference is not identity. The keys that must never be shared are
  // the session token and the profile, and the portal keeps its own for both
  // (ipbc_session / ipbc_user, read in portal.js). A shared theme cannot paint
  // somebody else's tickets.
  //
  // 'cream' resolves to light. The portal has one light palette, not two, so a
  // stored preference it cannot honour is mapped to the nearest one it can — never
  // left to fall through to the OS, which would look like the preference had been
  // ignored.
  try {
    var storedTheme = localStorage.getItem('theme');
    if (storedTheme === 'dark') document.documentElement.dataset.theme = 'dark';
    else if (storedTheme === 'light' || storedTheme === 'cream') document.documentElement.dataset.theme = 'light';
  } catch (e) { /* storage blocked — the OS setting decides, which is the default anyway */ }
</script>
</head>
<body>
<div id="portal-root"></div>

<script src="portal.js"></script>
<script>
  // portal.js only DEFINES the portal. This line is the whole of this page's own
  // logic: mount it. If the file failed to load there is nothing to mount, and the
  // empty page is the honest outcome — the alternative, a hand-written copy of the
  // markup here, is the drift this refactor exists to remove.
  if (window.CustomerPortal) window.CustomerPortal.mount(document.getElementById('portal-root'));
</script>
</body>
</html>
